name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]

# Run lama di PR yang sama dibatalkan saat ada push/edit/label baru; run di main tidak dibatalkan.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kebersihan-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR wajib menutup satu issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$BODY" | grep -Eiq '(closes|fixes|resolves) #[0-9]+'; then
            echo "::error::Deskripsi PR wajib memuat 'Closes #<nomor-issue>'."
            exit 1
          fi
      - name: Peringatan ukuran PR
        env:
          ADD: ${{ github.event.pull_request.additions }}
          DEL: ${{ github.event.pull_request.deletions }}
        run: |
          TOTAL=$((ADD + DEL))
          if [ "$TOTAL" -gt 400 ]; then
            echo "::warning::PR mengubah $TOTAL baris (>400). Pastikan isinya hanya satu tiket."
          fi
      # Daftar berkas terlindungi dan nama label diambil dari branch tujuan, supaya PR tidak bisa melonggarkan
      # pemeriksaan untuk dirinya sendiri. Branch tujuan yang belum punya berkasnya memakai berkas dari PR.
      - name: Berkas terlindungi butuh label persetujuan pemilik
        env:
          BASE: ${{ github.base_ref }}
        run: |
          CONFIG=$(git show "origin/$BASE:.github/jalankan-tiket.json" 2>/dev/null || cat .github/jalankan-tiket.json)
          LABEL=$(printf '%s' "$CONFIG" | jq -r '.labels.ownerApproved')
          PATTERNS=$(git show "origin/$BASE:.github/protected-paths.txt" 2>/dev/null || cat .github/protected-paths.txt)
          CHANGED=$(git diff --name-only "origin/$BASE...HEAD")
          PROTECTED=""
          while IFS= read -r p; do
            case "$p" in ''|'#'*) continue;; esac
            while IFS= read -r f; do
              case "$f" in "$p"*) PROTECTED="$PROTECTED$f"$'\n';; esac
            done <<< "$CHANGED"
          done <<< "$PATTERNS"
          if [ -n "$PROTECTED" ]; then
            if ! jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | grep -qxF "$LABEL"; then
              echo "::error::PR mengubah berkas terlindungi tanpa label '$LABEL':"
              printf '%s' "$PROTECTED"
              exit 1
            fi
          fi
      # Tanpa label persetujuan pemilik, daftar izin diambil dari branch tujuan. Dengan label itu, daftar milik PR yang berlaku.
      - name: Dependency harus ada di daftar izin
        env:
          BASE: ${{ github.base_ref }}
        run: |
          [ -f package.json ] || exit 0
          CONFIG=$(git show "origin/$BASE:.github/jalankan-tiket.json" 2>/dev/null || cat .github/jalankan-tiket.json)
          LABEL=$(printf '%s' "$CONFIG" | jq -r '.labels.ownerApproved')
          if jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | grep -qxF "$LABEL"; then
            ALLOW=$(cat .github/dependency-allowlist.txt)
          else
            ALLOW=$(git show "origin/$BASE:.github/dependency-allowlist.txt" 2>/dev/null || cat .github/dependency-allowlist.txt)
          fi
          FAIL=0
          for dep in $(jq -r '((.dependencies // {}) + (.devDependencies // {})) | keys[]' package.json); do
            OK=0
            while IFS= read -r pat; do
              case "$pat" in ''|'#'*) continue;; esac
              case "$dep" in $pat) OK=1; break;; esac
            done <<< "$ALLOW"
            if [ "$OK" -eq 0 ]; then echo "::error::Dependency di luar daftar izin: $dep"; FAIL=1; fi
          done
          exit $FAIL

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mandalika
          POSTGRES_PASSWORD: mandalika
          POSTGRES_DB: mandalika_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mandalika"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - id: cek
        run: |
          if [ -f package.json ]; then echo "ada=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::Belum ada package.json — menunggu tiket T00."; fi
      - name: MinIO (storage S3 untuk test)
        if: steps.cek.outputs.ada == '1'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: Muat variabel lingkungan test dari .env.ci
        if: steps.cek.outputs.ada == '1'
        run: |
          # .env.ci menunjuk port PostgreSQL dan MinIO lokal proyek ini. Di CI harus menunjuk layanan di atas.
          if [ -f .env.ci ]; then
            sed -i -E -e "s#@localhost:[0-9]+/#@localhost:5432/#" \
              -e "s#^S3_ENDPOINT=http://localhost:[0-9]+#S3_ENDPOINT=http://localhost:9000#" .env.ci
            grep -Ev '^\s*(#|$)' .env.ci >> "$GITHUB_ENV"
          fi
      - if: steps.cek.outputs.ada == '1'
        uses: pnpm/action-setup@v4
      - if: steps.cek.outputs.ada == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.cek.outputs.ada == '1'
        run: pnpm install --frozen-lockfile
      - if: steps.cek.outputs.ada == '1'
        run: pnpm verify
      - name: Test end-to-end (jika ada)
        if: steps.cek.outputs.ada == '1'
        run: |
          if jq -e '.scripts["test:e2e"]' package.json > /dev/null; then
            pnpm exec playwright install --with-deps chromium
            pnpm test:e2e
          else
            echo "::notice::Belum ada skrip test:e2e."
          fi
